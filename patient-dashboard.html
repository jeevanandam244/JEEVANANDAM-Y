<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">🩺 Sk hosipital</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="appointment.html">Book Appointment</a>
        <a href="patient-login.html">Logout</a>
    </nav>
</header>

<section class="dashboard">

    <h1>Patient Dashboard</h1>

    <div class="welcome">
        <h2>Welcome, Patient 👋</h2>
        <p>Manage your doctor appointments here.</p>
    </div>

    <div class="dashboard-cards">

        <div class="stat-card">
            <span>📅</span>
            <h2>3</h2>
            <p>Total Appointments</p>
        </div>

        <div class="stat-card">
            <span>⏳</span>
            <h2>1</h2>
            <p>Upcoming</p>
        </div>

        <div class="stat-card">
            <span>✅</span>
            <h2>2</h2>
            <p>Completed</p>
        </div>

    </div>

    <h2 class="table-title">Upcoming Appointment</h2>

    <div class="table-container">

        <table>

            <tr>
                <th>Doctor</th>
                <th>Specialization</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>Dr. jeeva</td>
                <td>Cardiologist</td>
                <td>25 Aug 2026</td>
                <td>10:30 AM</td>
                <td>
                    <span class="status">Confirmed</span>
                </td>
            </tr>

        </table>

    </div>

</section>

</body>
</html>
